spring:
  application:
    name: UserService

  datasource:
    url: jdbc:mysql://localhost:3306/fitnessMicroUser
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    #service to register via IP
    prefer-ip-address: true

server:
  port: 8081
